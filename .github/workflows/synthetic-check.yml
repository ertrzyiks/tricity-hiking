name: Synthetic check

on:
  # Keep in sync with CRON_SCHEDULE in scripts/synthetic-check.js, which
  # tells Sentry when to expect a check-in.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.5.0

      - name: Check the live site and report to Sentry
        env:
          # Kept out of the repo so the check-in URL can't be reconstructed
          # from public source - see the comment in synthetic-check.js.
          SENTRY_MONITOR_SLUG: ${{ secrets.SENTRY_MONITOR_SLUG }}
        run: node scripts/run-synthetic-check.js
